# ==============================================================================
# CloudDeploy — Root Docker Compose Configuration
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouddeploy-backend
    restart: always
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
    volumes:
      - backend_storage:/app/storage
    networks:
      - clouddeploy-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_DEMO_MODE=false
        - VITE_COGNITO_USER_POOL_ID=${AWS_COGNITO_USER_POOL_ID:-}
        - VITE_COGNITO_CLIENT_ID=${AWS_COGNITO_CLIENT_ID:-}
        - VITE_COGNITO_REGION=${AWS_REGION:-ap-south-1}
    container_name: clouddeploy-frontend
    restart: always
    networks:
      - clouddeploy-net

  nginx:
    image: nginx:1.27-alpine
    container_name: clouddeploy-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - clouddeploy-net

volumes:
  backend_storage:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  clouddeploy-net:
    driver: bridge
