spring:
  datasource:
    url: jdbc:h2:mem:clouddeploy_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  storage-mode: local
  local-storage-path: ./target/test-storage
  demo-auth-enabled: true

