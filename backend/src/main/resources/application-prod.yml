spring:
  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME:clouddeploy-db.cluster-custom.ap-south-1.rds.amazonaws.com}:${RDS_PORT:3306}/${RDS_DB_NAME:clouddeploy}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${RDS_USERNAME:clouddeploy_admin}
    password: ${RDS_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  storage-mode: s3
  demo-auth-enabled: false
