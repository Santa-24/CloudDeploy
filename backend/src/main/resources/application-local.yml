spring:
  datasource:
    url: jdbc:h2:file:./storage/h2db/clouddeploy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  storage-mode: ${APP_STORAGE_MODE:s3}
  local-storage-path: ./storage
  demo-auth-enabled: ${APP_DEMO_AUTH_ENABLED:false}
